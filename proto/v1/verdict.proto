syntax = "proto3";
package chartered.v1;

// Per-Frame decision. See docs/SPECIFICATION.md > Frames.
message Verdict {
  string frame_id = 1;
  Ruling ruling = 2;
  string reason = 3;                           // one sentence; surfaces to Steward on denial
  repeated EvaluatorEntry evaluator_trace = 4;

  enum Ruling {
    RULING_UNSPECIFIED = 0;
    GROUNDED = 1;
    UNGROUNDED = 2;
    UNCERTAIN = 3;
    OUT_OF_SCOPE = 4;
  }
}

message EvaluatorEntry {
  string evaluator_id = 1;
  Decision decision = 2;
  string observation = 3;
  Metrics metrics = 4;

  // DEFER ≠ Outcome.PASSTHROUGH (receipt.proto). DEFER = chain-step "next evaluator"; PASSTHROUGH = "not evaluated".
  enum Decision {
    DECISION_UNSPECIFIED = 0;
    ALLOW = 1;                                 // confidently affirms Frame (or vacuously: not applicable)
    DENY = 2;
    ESCALATE = 3;                              // chain exhausted
    DEFER = 4;
  }
}

message Metrics {
  uint32 latency_ms = 1;
  uint32 input_tokens = 2;      // LLM evaluator only
  uint32 output_tokens = 3;     // LLM evaluator only
  uint32 cache_hit_tokens = 4;  // LLM evaluator only (prompt-cache hits)
}
