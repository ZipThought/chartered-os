syntax = "proto3";
package chartered.v1;

import "v1/tool_call.proto";
import "v1/verdict.proto";
import "v1/receipt.proto";

// Runtime ↔ Gate ↔ Daemon messages. See docs/SPECIFICATION.md > The Loop, > Receipts.
message EvaluateRequest {
  ToolCall tool_call = 1;        // tool_call.source_id identifies the Steward
  string snapshot_id = 2;        // the content-addressed Snapshot the loop is running under
}

message EvaluateResponse {
  repeated Verdict verdicts = 1;
  Outcome outcome = 2;
  string feedback = 3;          // frame_id: reason for each violating Frame; minimum signal, smallest attack surface
}

message SubmitReceipt {
  Receipt receipt = 1;
}

message SubmitReceiptAck {
  bool accepted = 1;
  string error = 2;             // populated when accepted=false; Runtime falls back to local file storage
}
