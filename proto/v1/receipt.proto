syntax = "proto3";
package chartered.v1;

import "google/protobuf/timestamp.proto";
import "v1/tool_call.proto";
import "v1/verdict.proto";

// Receipt-level aggregate over per-Frame Verdicts. See docs/SPECIFICATION.md > Receipts.
enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  ALLOWED = 1;     // every Frame GROUNDED
  DENIED = 2;      // at least one Frame UNGROUNDED
  ESCALATED = 3;   // refinement budget exhausted
  PASSTHROUGH = 4; // no evaluation performed (passthrough enforcement)
}

// See docs/SPECIFICATION.md > Requisite Variety for why no intermediate level exists.
enum EnforcementLevel {
  ENFORCEMENT_LEVEL_UNSPECIFIED = 0;
  PASSTHROUGH_LEVEL = 1;
  FULL_LEVEL = 2;
}

message Receipt {
  string receipt_id = 1;
  ToolCall tool_call = 2;
  repeated Verdict verdicts = 3;            // one per applicable Frame; empty under PASSTHROUGH
  Outcome outcome = 4;
  google.protobuf.Timestamp timestamp = 5;
  Metrics metrics = 6;
  EnforcementLevel enforcement_level = 7;
  bool intercept_complete = 8;              // false on any partial-coverage condition (timeout, evaluator unreachable, durability degraded)
  string adapter_id = 9;                    // Runtime or Adapter identifier
  uint64 charter_version = 10;
  uint64 role_context_version = 11;
  string snapshot_id = 12;
}
