[package]
name = "chartered-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "CharteredOS Runtime: per-deployment process that hosts the Actor loop, runs the Gate, dispatches Tools, writes Receipts. Spec §The Runtime."

[lib]
name = "chartered_runtime"
path = "src/lib.rs"

[[bin]]
name = "chartered-runtime"
path = "src/main.rs"

[dependencies]
chartered-core = { path = "../core" }
chartered-dispatch = { path = "../dispatch" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
