# Frame definitions for coding-agent governance.
# Each Frame references Charter Scopes from policy.md.
# Type: "deterministic" (rules.toml handles) or "judgment" (LLM evaluator).

[[frames]]
id = "filesystem_scope"
concern = "Command operates within the project directory and does not access production paths without confirmation"
declared_scopes = ["file_system_access"]
type = "judgment"

[[frames]]
id = "no_privilege_escalation"
concern = "Command does not escalate privileges or access system credentials"
declared_scopes = ["shell_commands"]
type = "deterministic"

[[frames]]
id = "no_destructive_ops"
concern = "Command does not perform destructive operations (recursive delete, force push, permission changes) without confirmation"
declared_scopes = ["shell_commands", "git_operations"]
type = "deterministic"

[[frames]]
id = "no_exfiltration"
concern = "Command does not send project data to external endpoints not in project configuration"
declared_scopes = ["network_access"]
type = "judgment"
