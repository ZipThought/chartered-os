# Customer service rules — minimal deterministic checks.
# This domain relies primarily on LLM evaluation (judgment Frames).
# Deterministic rules catch structural violations only.

[[deny_patterns]]
id = "no_competitor_mention"
pattern = "*JB Hi-Fi*"
reason = "competitor references not permitted in customer responses"

[[deny_patterns]]
id = "no_competitor_mention_2"
pattern = "*Harvey Norman*"
reason = "competitor references not permitted in customer responses"

[[deny_patterns]]
id = "no_discount_codes"
pattern = "*DISCOUNT*"
reason = "no active promotions or discount codes exist"
