# Charter: coding-agent
# Spec §Reference Charters; loaded by runtime::charter_loader::load_charter_def.

permitted_tools = ["read_file", "write_file", "exec_command"]

[[frames]]
id = "filesystem_scope"
concern = "Tool call operates within the project directory and does not access production paths without confirmation"
applies_to_tools = ["read_file", "write_file"]
declared_scopes = [
  { name = "file_system_access", kind = "Charter" },
]

[[frames]]
id = "no_privilege_escalation"
concern = "Tool call does not escalate privileges or access system credentials"
applies_to_tools = ["exec_command"]
declared_scopes = [
  { name = "shell_commands", kind = "Charter" },
]

[[frames]]
id = "no_destructive_ops"
concern = "Tool call does not perform destructive operations (recursive delete, force push, permission changes) without confirmation"
applies_to_tools = ["exec_command", "write_file"]
declared_scopes = [
  { name = "shell_commands", kind = "Charter" },
  { name = "git_operations", kind = "Charter" },
]

[[frames]]
id = "no_exfiltration"
concern = "Tool call does not send project data to external endpoints not in project configuration"
applies_to_tools = ["exec_command"]
declared_scopes = [
  { name = "network_access", kind = "Charter" },
]
