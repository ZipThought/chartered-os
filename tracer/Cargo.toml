[package]
name = "chartered-tracer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Standalone syscall-level trace tool, peer to Docker/gVisor/strace. Companion to CharteredOS but not part of its architecture; operators deploy it independently for post-dispatch subprocess observability."

[[bin]]
name = "chartered-trace"
path = "src/main.rs"

[dependencies]
libseccomp = "0.4"
libc = "0.2"
nix = { version = "0.29", features = ["process", "socket", "uio"] }
