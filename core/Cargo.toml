[package]
name = "chartered-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "CharteredOS kernel: the negative-feedback loop's comparator and controller. Frame, Evaluator, Gate, Receipt, Snapshot, refinement signal."

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "test-util"] }
tempfile = "3"
